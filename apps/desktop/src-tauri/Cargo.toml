[package]
name = "app"
version = "1.0.0"
description = "Trailers Fast — mark spots on long videos, get a short trailer"
authors = ["Paul Walczewski"]
license = "MIT"
repository = "https://github.com/paulwalczewski/trailersfast"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
ffmpeg-sidecar = "2"
base64 = "0.22"
# Embedded MCP server (AI integration)
rmcp = { version = "2", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time", "macros"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
# Constant-time bearer-token comparison for the MCP auth layer.
subtle = "2"
tempfile = "3.27.0"

# Default release settings leave a lot on the table for a desktop bundle: no
# cross-crate inlining, full debug symbols in the shipped binary, and unwind
# tables for panics we never catch. `opt-level = "s"` is deliberate over "z" —
# it keeps the loop vectorisation the frame/preview paths depend on.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
